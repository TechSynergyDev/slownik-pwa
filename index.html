<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Słownik PWA</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 5px; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-bottom: 20px; }
        .online { background: #065f46; color: #34d399; }
        .offline { background: #78350f; color: #fbbf24; }
        .card { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; box-sizing: border-box; }
        button { background: #2563eb; border: none; font-weight: bold; cursor: pointer; }
        button:active { background: #1d4ed8; }
        .word-item { background: #334155; padding: 12px; border-radius: 8px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .badge-sync { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #78350f; color: #fbbf24; }
        .badge-cloud { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #065f46; color: #34d399; }
    </style>
</head>
<body>
<div class="container">
    <h1>Słownik PWA</h1>
    <div id="net-status" class="status-badge online">● Online</div>

    <div class="card">
        <h3>Dodaj nowe słówko</h3>
        <input type="text" id="eng-input" placeholder="Angielski (np. Apple)">
        <input type="text" id="pl-input" placeholder="Polski (np. Jabłko)">
        <button onclick="addNewWord()">Dodaj słówko</button>
    </div>

    <div class="card">
        <button onclick="forceSync()" style="background: #059669;">🔄 Testuj połączenie z Azure</button>
    </div>

    <h2>Twoje słówka</h2>
    <div id="words-list"></div>
</div>

<script>
    // Oficjalny, poprawny adres Twojego API w Azure
    const AZURE_API_URL = "api-slownika-2026-dza6f8gwdugaexg8.polandcentral-01.azurewebsites.net";
    const AZURE_FUNCTION_KEY = "OaQr-ZvTVr3DYcTUS1XsZ-E4PtowdXjz3TtUJyZyqJ6XAzFux4p-jA==";
    
    let db;
    const request = indexedDB.open("SlownikDB", 1);

    request.onerror = (event) => console.error("IndexedDB error:", event.target.error);
    request.onsuccess = (event) => {
        db = event.target.result;
        loadWords();
    };
    request.onupgradeneeded = (event) => {
        db = event.target.result;
        if (!db.objectStoreNames.contains("words")) {
            db.createObjectStore("words", { keyPath: "id", autoIncrement: true });
        }
    };

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    function updateOnlineStatus() {
        const statusEl = document.getElementById("net-status");
        if (navigator.onLine) {
            statusEl.textContent = "● Online";
            statusEl.className = "status-badge online";
            syncData();
        } else {
            statusEl.textContent = "● Offline";
            statusEl.className = "status-badge offline";
        }
    }

    function addNewWord() {
        const eng = document.getElementById("eng-input").value.trim();
        const pl = document.getElementById("pl-input").value.trim();
        if (!eng || !pl) return alert("Wypełnij oba pola!");

        const transaction = db.transaction(["words"], "readwrite");
        const store = transaction.objectStore("words");
        const wordObj = { english: eng, polish: pl, synced: false, createdAt: new Date().toISOString() };

        const req = store.add(wordObj);
        req.onsuccess = () => {
            document.getElementById("eng-input").value = "";
            document.getElementById("pl-input").value = "";
            loadWords();
            syncData();
        };
    }

    function loadWords() {
        if (!db) return;
        const transaction = db.transaction(["words"], "readonly");
        const store = transaction.objectStore("words");
        const req = store.getAll();

        req.onsuccess = () => {
            const listEl = document.getElementById("words-list");
            listEl.innerHTML = "";
            req.result.reverse().forEach(word => {
                const div = document.createElement("div");
                div.className = "word-item";
                div.innerHTML = `
                    <div>
                        <strong>${word.english}</strong><br><small>${word.polish}</small>
                    </div>
                    <span class="${word.synced ? 'badge-cloud' : 'badge-sync'}">
                        ${word.synced ? 'Zapisano w chmurze' : 'Lokalnie (Offline)'}
                    </span>
                `;
                listEl.appendChild(div);
            });
        };
    }

    async function syncData() {
        if (!navigator.onLine) return;
        try {
            const transaction = db.transaction(["words"], "readonly");
            const store = transaction.objectStore("words");
            const req = store.getAll();

            req.onsuccess = async () => {
                const words = req.result;
                for (const word of words) {
                    if (!word.synced) {
                        try {
                            const response = await fetch(AZURE_API_URL, {
                                method: "POST",
                                headers: { 
                                    "Content-Type": "application/json",
                                    "x-functions-key": AZURE_FUNCTION_KEY
                                },
                                body: JSON.stringify({ english: word.english, polish: word.polish })
                            });
                            if (response.ok) {
                                markAsSynced(word.id);
                            }
                        } catch (e) {
                            console.log("Sync failed for item", e);
                        }
                    }
                }
            };
        } catch (err) {
            console.error("Sync error:", err);
        }
    }

    function markAsSynced(id) {
        const transaction = db.transaction(["words"], "readwrite");
        const store = transaction.objectStore("words");
        const req = store.get(id);
        req.onsuccess = () => {
            const data = req.result;
            if (data) {
                data.synced = true;
                store.put(data);
                loadWords();
            }
        };
    }

    // Zaawansowana funkcja testowa przechwytująca wszystkie możliwe przypadki z dokładnym opisem
    async function forceSync() {
        if (!navigator.onLine) {
            return alert("🌐 BRAK INTERNETU:\nTwoje urządzenie jest offline. Połącz się z siecią, aby przetestować Azure.");
        }

        const testPayload = { english: "TestManual", polish: "RęcznyTest" };
        
        // Ustawiamy maksymalny czas oczekiwania (10 sekund), żeby przeglądarka nie "wisiała"
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000); 

        try {
            const response = await fetch(AZURE_API_URL, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "x-functions-key": AZURE_FUNCTION_KEY
                },
                body: JSON.stringify(testPayload),
                signal: controller.signal
            });

            clearTimeout(timeoutId); // Zatrzymujemy odliczanie, jeśli serwer odpowiedział

            // Przypadek 1: Pełen sukces (kody HTTP 200-299)
            if (response.ok) {
                alert("✅ SUKCES!\nPołączenie z Azure działa perfekcyjnie, dane zostały przyjęte. Autoryzacja i CORS są poprawne!");
                syncData(); 
            } else {
                const text = await response.text();
                
                // Przypadek 2: Problem z kluczem dostępu
                if (response.status === 401 || response.status === 403) {
                    alert(`❌ BŁĄD AUTORYZACJI (HTTP ${response.status}):\nAzure odrzucił zapytanie. Klucz 'x-functions-key' jest niepoprawny lub nie dotarł. Upewnij się, że skopiowałeś dobry klucz Default z Azure.\nTreść z serwera: ${text}`);
                } 
                // Przypadek 3: Zły adres lub funkcja nie istnieje
                else if (response.status === 404) {
                    alert(`❌ NIE ZNALEZIONO ZASOBU (HTTP 404):\nAzure odpowiada, ale pod adresem nie ma funkcji 'words'. Sprawdź, czy adres API URL w kodzie jest prawidłowy.\nTreść z serwera: ${text}`);
                } 
                // Przypadek 4: Błąd wysłanych danych
                else if (response.status === 400) {
                    alert(`❌ BŁĄD STRUKTURY DANYCH (HTTP 400):\nAzure przyjął zapytanie, ale odrzucił treść. Prawdopodobnie kod Twojej funkcji w C# wymaga innych pól w JSON.\nTreść z serwera: ${text}`);
                } 
                // Przypadek 5: Błąd w kodzie serwera Azure
                else if (response.status >= 500) {
                    alert(`❌ AWARIA SERWERA AZURE (HTTP ${response.status}):\nPołączenie udane, ale wystąpił błąd krytyczny w kodzie po stronie chmury (np. baza danych nie działa lub błąd w C#). Sprawdź "Log stream" w Azure.\nTreść z serwera: ${text}`);
                } 
                // Przypadek 6: Inne błędy HTTP
                else {
                    alert(`⚠️ NIEOCZEKIWANY BŁĄD (HTTP ${response.status}):\nOtrzymano niezidentyfikowany kod odpowiedzi z serwera.\nTreść: ${text}`);
                }
            }
        } catch (err) {
            clearTimeout(timeoutId);
            
            // Przypadek 7: Serwer Azure nie odpowiada (przekroczono 10 sekund)
            if (err.name === 'AbortError') {
                alert("⏳ PRZEKROCZONO CZAS (TIMEOUT):\nSerwer Azure nie odpowiada od 10 sekund. Wejdź na Azure i sprawdź czy usługa Function App jest uruchomiona ('Running').");
            } 
            // Przypadek 8: Problem CORS lub adblocker zabił zapytanie w przeglądarce
            else if (err.message.includes("Failed to fetch") || err.message.includes("NetworkError")) {
                alert(`🚫 BŁĄD SIECI / CORS:\nPrzeglądarka zablokowała żądanie zanim dotarło do serwera (NetworkError / Failed to fetch).\n\nMOŻLIWE PRZYCZYNY:\n1. Adres strony GitHub Pages nadal nie jest poprawnie załadowany w zakładce CORS na Azure (lub nie odświeżono pamięci podręcznej przeglądarki z nowym kodem HTML).\n2. Rozszerzenie typu AdBlock blokuje zapytanie.\n3. Całkowicie nieaktywny serwer (Azure jest wyłączony).`);
            } 
            // Przypadek 9: Inne błędy techniczne przeglądarki
            else {
                alert(`⚠️ NIEZNANY BŁĄD TECHNICZNY:\nSprawdź konsolę przeglądarki (F12). Treść błędu: ${err.message}`);
            }
        }
    }
</script>
</body>
</html>
